[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycircuit-hisi"
version = "6.1.0"
description = "A Python-based hardware description framework that compiles Python to RTL through MLIR"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "PTO-ISA Contributors" }
]
requires-python = ">=3.10"
keywords = ["hardware", "rtl", "verilog", "mlir", "hdl", "fpga", "asic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/PTO-ISA/pyCircuit"
Repository = "https://github.com/PTO-ISA/pyCircuit"
Issues = "https://github.com/PTO-ISA/pyCircuit/issues"
Releases = "https://github.com/PTO-ISA/pyCircuit/releases"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-xdist>=3.8.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.7.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mdx-gh-links>=0.2.0",
]

[project.scripts]
pycircuit = "pycircuit.cli:main"

[tool.setuptools.packages.find]
where = ["python/pycircuit/src"]

[tool.setuptools.package-data]
pycircuit = ["**/*.py", "**/*.md"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["docs/gates/logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tools/pycircuit/generate_source_identifier_unicode.py" = ["T201"]
"python/pycircuit/src/pycircuit/__init__.py" = ["A004"]
"python/pycircuit/src/pycircuit/cli.py" = ["A004", "T201"]
"tests/integration/pycircuit/fixtures/**/*.py" = ["I001", "T201"]
"examples/**/*.py" = ["F401", "F841", "I001", "N803", "N806", "N999", "T201"]
"flows/tools/*.py" = ["T201"]
"cmake/prepare_output.py" = ["T201"]
"cmake/verify_example.py" = ["T201"]
"packaging/wheel/get_wheel_plat_name.py" = ["T201"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "python/pycircuit/src",
    ".",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: fast Python-only tests",
    "system: end-to-end compiler and simulation tests",
]
