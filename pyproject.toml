[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycircuit-hisi"
version = "6.1.0"
description = "A Python-based hardware description framework that compiles Python to RTL through MLIR"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "PTO-ISA Contributors" }
]
requires-python = ">=3.10"
keywords = ["hardware", "rtl", "verilog", "mlir", "hdl", "fpga", "asic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/PTO-ISA/pyCircuit"
Repository = "https://github.com/PTO-ISA/pyCircuit"
Issues = "https://github.com/PTO-ISA/pyCircuit/issues"
Releases = "https://github.com/PTO-ISA/pyCircuit/releases"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-xdist>=3.8.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.7.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mdx-gh-links>=0.2.0",
]

[project.scripts]
pycircuit = "pycircuit.cli:main"

[tool.setuptools.packages.find]
where = ["python"]
include = ["pycircuit", "pycircuit.*"]
namespaces = false

[tool.setuptools.package-data]
pycircuit = ["**/*.py", "**/*.md"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313"]
# Static compiler sources are byte/line-sensitive diagnostic fixtures. Keep
# executable fixture generators and verification helpers formatted.
force-exclude = '''
tests/compiler/lit/Source/Inputs/(?!(?:
bits-(?:concat|count-zeros|popcount|priority-encoding)|
case-statements|case_capture_guards|defaults-composition|
dependent-width-binding|direct-call-graph|enum-source|enum_source_execution|
fixed-(?:predicates|slices|unsigned-shifts|widening)|frontend-branches|
literal-normalization-adversarial|multi-rule-writes|pythonic-memory|
queue-source(?:-vectors)?|record-projection-simplification|rob-behavioral|
source-check(?:-execution|s)|source_computed_outputs|
source_exact_(?:integers|select|shift)|source_interface_public|
source_local_bindings|source_module_bindings|source_observation_behavioral|
static-divrem|table-queries/table_query_(?:admission|cases)
)\.py$).*\.py$
'''

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["docs/gates/logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tools/generate_source_identifier_unicode.py" = ["T201"]
"python/pycircuit/__init__.py" = ["A004"]
"python/pycircuit/cli.py" = ["A004", "T201"]
"tests/integration/fixtures/**/*.py" = ["I001", "T201"]
# Source grammar permits uppercase definitions, symbolic output annotations,
# and deliberately ordered imports; negative fixtures exercise invalid bindings.
"tests/compiler/lit/Source/Inputs/**/*.py" = ["I001", "N802", "N803", "N806", "F821", "T201"]
"tests/compiler/lit/Source/Inputs/local_binding_bad*.py" = ["F401", "F811", "F823", "F841", "A001", "N813"]
"tests/compiler/lit/Source/Inputs/numeric_bad*.py" = ["F401"]
"tests/compiler/lit/lit.cfg.py" = ["F821"] # lit injects config.
"tests/compiler/lit/CodeGen/Inputs/*.py" = ["T201"] # Standalone lit helpers.
"tests/integration/source-unit-build/src/*.py" = ["N802", "F841"]
"tests/integration/source-unit-build/prepare_unit_output.py" = ["T201"]
"tests/system/fixtures/source_system/*.py" = ["N802", "F821"]
"tests/system/fixtures/source_system/atomic_bench.py" = ["B011"] # Hardware assertion.
"examples/**/*.py" = ["F401", "F841", "I001", "N803", "N806", "N999", "T201"]
"tools/*.py" = ["T201"]
"cmake/prepare_output.py" = ["T201"]
"cmake/verify_example.py" = ["T201"]
"packaging/wheel/get_wheel_plat_name.py" = ["T201"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "python",
    ".",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: fast Python-only tests",
    "system: end-to-end compiler and simulation tests",
]
