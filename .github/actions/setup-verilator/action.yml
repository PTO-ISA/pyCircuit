name: Setup Verilator
description: Install a recent Verilator binary (Ubuntu apt is too old for G1/G2 timing).

inputs:
  version:
    description: Verilator version (x.yyy), matching veryl-lang/verilator-package releases
    required: false
    default: "5.048"

runs:
  using: composite
  steps:
    # Pure bash install (no Node action) so CI stays off deprecated Node.js 20 actions.
    - name: Install Verilator package
      shell: bash
      env:
        VERILATOR_VERSION: ${{ inputs.version }}
      run: |
        set -euxo pipefail
        . /etc/os-release
        case "${ID}-${VERSION_ID}" in
          ubuntu-24.04)
            image="ubuntu-24.04"
            checksum="22dff8584d88c700e0f9876f17ef4f8efdf02b342798836e68d52f7a2fee08b0"
            ;;
          ubuntu-22.04)
            image="ubuntu-22.04"
            checksum="c17c865fff3c17adeecd45f5f2a214d93a75dc12a1e689dcbd46c1234ea03452"
            ;;
          *)
            echo "unsupported runner image for prebuilt Verilator: ${ID}-${VERSION_ID}" >&2
            exit 1
            ;;
        esac
        ver="${VERILATOR_VERSION#v}"
        if [[ "${ver}" != "5.048" ]]; then
          echo "unsupported Verilator version without a pinned checksum: ${ver}" >&2
          exit 1
        fi
        url="https://github.com/veryl-lang/verilator-package/releases/download/v${ver}/verilator-${image}.zip"
        dest="${RUNNER_TEMP}/verilator-${ver}"
        rm -rf "${dest}"
        mkdir -p "${dest}"
        archive="${RUNNER_TEMP}/verilator-${ver}-${image}.zip"
        curl --proto '=https' --tlsv1.2 -fsSL "${url}" -o "${archive}"
        printf '%s  %s\n' "${checksum}" "${archive}" | sha256sum --check --strict
        unzip -o -q "${archive}" -d "${dest}"
        # Package layout is either dest/bin or dest/<single-dir>/bin.
        if [[ -d "${dest}/bin" ]]; then
          root="${dest}"
        else
          root="$(find "${dest}" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
        fi
        [[ -x "${root}/bin/verilator" ]]
        echo "${root}/bin" >> "${GITHUB_PATH}"
        # Prebuilt kit root contains bin/ + include/ (not share/verilator).
        echo "VERILATOR_ROOT=${root}" >> "${GITHUB_ENV}"
        # Packaged verilated.mk invokes ccache; mold is optional but cheap.
        sudo apt-get update
        sudo apt-get install -y ccache mold

    - name: Verify Verilator
      shell: bash
      run: |
        set -euxo pipefail
        command -v verilator
        verilator --version
        # Gates need >= 5.024 for --quiet and modern timing behavior.
        ver="$(verilator --version | awk '{print $2; exit}')"
        python3 -c '
        import sys
        ver = sys.argv[1]
        major, minor = (int(x) for x in ver.split(".")[:2])
        if (major, minor) < (5, 24):
            raise SystemExit(f"Verilator {ver} is too old; need >= 5.024")
        print(f"ok: verilator {ver}")
        ' "${ver}"
