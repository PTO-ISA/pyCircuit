name: CI (macOS)

# Separate from Linux CI so labeling a PR with `ci-macos` does not create a new
# "CI" run that skips required G1/G2 jobs (which would block merge).
on:
  workflow_dispatch:
  push:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-macos-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: "22"

jobs:
  # Skip the duplicate push run when the pushed branch has an open PR —
  # the pull_request synchronize event will cover the same commit.
  gate:
    name: Decide
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="${GITHUB_REF#refs/heads/}"
          count=$(gh pr list --repo "${{ github.repository }}" \
                    --state open --head "${branch}" --json number --limit 1 \
                    | jq 'length')
          if [[ "${count}" -gt 0 ]]; then
            echo "Skipping push run: PR exists for ${branch} (pull_request event will run)."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  build-macos:
    name: "G0/G1: Build Toolchain (macOS)"
    needs: gate
    # PR default: skip. Run on main/develop push, workflow_dispatch, or label ci-macos.
    if: >
      needs.gate.outputs.should_run == 'true' && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-macos'))
      )
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install wheel build deps
        run: python -m pip install setuptools wheel

      - name: Install Homebrew packages
        run: |
          brew update
          brew install ninja cmake "llvm@${LLVM_VERSION}" python@3
          echo "$(brew --prefix "llvm@${LLVM_VERSION}")/bin" >> "$GITHUB_PATH"

      - name: Build staged toolchain
        run: |
          bash flows/scripts/pyc build \
            --llvm-config "$(brew --prefix "llvm@${LLVM_VERSION}")/bin/llvm-config" \
            --build-dir "$PWD/.pycircuit_out/toolchain/build" \
            --install-prefix "$PWD/.pycircuit_out/toolchain/install"

      - name: Build platform wheel
        run: |
          python packaging/wheel/create_wheel.py \
            --install-dir "$PWD/.pycircuit_out/toolchain/install" \
            --out-dir "$PWD/dist"

      - name: Check wheel tag
        shell: bash
        run: |
          set -euxo pipefail
          wheel="$(basename dist/*.whl)"
          [[ "${wheel}" == pycircuit_hisi-*-py3-none-*.whl ]]

      - name: Run example compile gate
        run: |
          export PYC_TOOLCHAIN_ROOT="$PWD/.pycircuit_out/toolchain/install"
          export PATH="$PYC_TOOLCHAIN_ROOT/bin:$PATH"
          export PYC_SKIP_SEMANTIC_REGRESSIONS=1
          unset PYCC
          bash flows/scripts/run_examples.sh

      - name: Smoke test installed wheel
        shell: bash
        run: |
          set -euxo pipefail
          python -m venv .venv-wheel
          source .venv-wheel/bin/activate
          pip install dist/*.whl
          export PYC_TOOLCHAIN_ROOT="$(python -c 'import pycircuit, pathlib; print((pathlib.Path(pycircuit.__file__).resolve().parent / "_toolchain").as_posix())')"
          export PYC_USE_INSTALLED_PYTHON_PACKAGE=1
          export PYC_SKIP_SEMANTIC_REGRESSIONS=1
          unset PYCC
          bash flows/scripts/run_examples.sh

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pyc-wheel-macos
          path: dist/*.whl
          retention-days: 1
