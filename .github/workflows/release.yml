name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version matching repository metadata
        required: true
        type: string
      commit_sha:
        description: Full commit SHA to validate, package, tag, and publish
        required: true
        type: string

permissions:
  contents: read

env:
  LLVM_VERSION: "22"
  LLVM_INSTALL_SCRIPT_SHA256: "03878e08f47b66cc95bc4b544b0db3c6d9ce8d60e6cf2492ae357984330a9eae"
  # Exact LLVM/MLIR release pinned by toolchains/agentic-circuit/llvm.lock.json.
  # The automated Windows installers ship llvm/clang/lld CMake packages but no
  # MLIR at all (verified against the published 22.1.8 asset), and pyCircuit
  # needs MLIR_DIR for pyc-opt/pycc. The Windows lane therefore builds the
  # pinned source once and caches the install prefix; the option set mirrors the
  # RTTI/EH configuration of the known-good macOS lane, and
  # LLVM_WINDOWS_BUILD_ID salts the cache key so an option change starts a fresh
  # build instead of reusing an incompatible prefix.
  LLVM_PACKAGE_VERSION: "22.1.8"
  LLVM_SOURCE_URL: "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/llvm-project-22.1.8.src.tar.xz"
  LLVM_SOURCE_SHA256: "922f1817a0df7b1489272d18134ee0087a8b068828f87ac63b9861b1a9965888"
  LLVM_WINDOWS_BUILD_ID: "source-v1"
  LLVM_WINDOWS_CMAKE_OPTIONS: "-DLLVM_ENABLE_PROJECTS=mlir -DLLVM_TARGETS_TO_BUILD=X86 -DLLVM_ENABLE_ASSERTIONS=OFF -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_DOCS=OFF -DLLVM_BUILD_LLVM_DYLIB=OFF -DLLVM_LINK_LLVM_DYLIB=OFF -DLLVM_ENABLE_RTTI=ON -DLLVM_ENABLE_EH=OFF -DLLVM_ENABLE_TERMINFO=OFF -DLLVM_ENABLE_LIBXML2=OFF -DLLVM_ENABLE_ZLIB=OFF -DLLVM_ENABLE_ZSTD=OFF -DMLIR_ENABLE_BINDINGS_PYTHON=OFF"
  # The Windows lane compiles with clang-cl rather than cl.exe, matching the
  # clang/clang++ drivers the Linux and macOS lanes already use. The MSVC front
  # end aborts with an internal compiler error (C1001, msc1.cpp) on the ACIR
  # codegen's recursive generic lambdas, while the same sources build under
  # clang. The driver comes from the official clang+llvm 22.1.8 Windows
  # release -- the same release tag as the pinned MLIR source above -- so the
  # compiler is checksum-pinned and matches the LLVM/MLIR it links. clang-cl
  # keeps the MSVC v143 ABI, runtime, and win_amd64 wheel identity; only the
  # driver changes, and the MSVC developer environment stays mandatory because
  # clang-cl reads INCLUDE/LIB from it. See Decision 0265.
  CLANG_PACKAGE_VERSION: "22.1.8"
  CLANG_RESOURCE_VERSION: "22"
  CLANG_SOURCE_URL: "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/clang+llvm-22.1.8-x86_64-pc-windows-msvc.tar.xz"
  CLANG_SOURCE_SHA256: "d96c2cc1736f4eb7fa43cb9bbdf56d93551a9ae0a9aadb9c99c3c3b2b712a234"
  VERILATOR_VERSION: "5.048"
  PYC_GATE_RUN_ID: release-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  full-validation:
    name: "Release: Full AC/PYC Closure"
    if: github.repository == 'PTO-ISA/pyCircuit'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Validate release version and source identity
        run: |
          set -euo pipefail
          [[ "${{ inputs.commit_sha }}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${{ inputs.commit_sha }}"
          project="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          semantic="$(python3 -c 'import tomllib; print(tomllib.load(open("python/semantic-core/pyproject.toml", "rb"))["project"]["version"])')"
          test "${{ inputs.version }}" = "${project}"
          test "${{ inputs.version }}" = "${semantic}"
          test "v${{ inputs.version }}" = "$(python3 -c 'import json; print(json.load(open("packaging/sdk/version-map.json"))["candidate_tag"])')"
          ! git ls-remote --exit-code --tags origin "refs/tags/v${{ inputs.version }}"
      - name: Install Python, LLVM, and simulation dependencies
        run: |
          set -euxo pipefail
          python -m pip install -e "python/semantic-core"
          python -m pip install -e ".[dev,docs]"
          python -m pip install -e "python/agentic-circuit[test]"
          sudo apt-get update
          sudo apt-get install -y wget gnupg software-properties-common cmake ninja-build clang iverilog libgtest-dev
          wget --https-only https://apt.llvm.org/llvm.sh
          printf '%s  %s\n' "${LLVM_INSTALL_SCRIPT_SHA256}" llvm.sh | sha256sum --check --strict
          chmod +x llvm.sh
          sudo ./llvm.sh "${LLVM_VERSION}"
          sudo apt-get install -y "llvm-${LLVM_VERSION}-dev" "mlir-${LLVM_VERSION}-tools" "libmlir-${LLVM_VERSION}-dev"
          echo "/usr/lib/llvm-${LLVM_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Setup Verilator
        uses: ./.github/actions/setup-verilator
        with:
          version: ${{ env.VERILATOR_VERSION }}
      - name: Build integrated toolchain
        run: |
          export PYC_PYTHON_EXECUTABLE="$(command -v python3)"
          PYC_BUILD_AGENTIC_CIRCUIT_TESTS=ON bash flows/scripts/pyc build --llvm-config "/usr/lib/llvm-${LLVM_VERSION}/bin/llvm-config" --build-dir "$PWD/.pycircuit_out/toolchain/build" --install-prefix "$PWD/.pycircuit_out/toolchain/install"
      - name: Run full Agentic Circuit closure
        run: |
          export AC_GATE_BUILD_ROOT="$PWD/.pycircuit_out/toolchain/build"
          export AC_GATE_TOOLCHAIN_ROOT="$PWD/.pycircuit_out/toolchain/install"
          bash flows/scripts/run_agentic_circuit.sh
      - name: Run repository contract closure
        run: |
          SKIP=pyc-api-hygiene pre-commit run --all-files
          python3 .github/scripts/validate_repo_management.py
          pytest tests/unit -m unit
          python3 flows/tools/check_api_hygiene.py python/pycircuit/src/pycircuit examples/pycircuit docs README.md
          python3 flows/tools/check_decision_status.py --rfc docs/rfcs/pyc6-decisions.md --status docs/gates/decision_status_v6.md --out "docs/gates/logs/${PYC_GATE_RUN_ID}/release_decision_status.json" --require-no-deferred --require-all-verified --require-concrete-evidence --require-existing-evidence
          mkdocs build --strict
      - name: Run full pyCircuit closure
        run: |
          export PYC_TOOLCHAIN_ROOT="$PWD/.pycircuit_out/toolchain/install"
          export PATH="$PYC_TOOLCHAIN_ROOT/bin:$PATH"
          unset PYCC || true
          bash flows/scripts/run_examples.sh
          bash flows/scripts/run_sims.sh
          bash flows/scripts/run_sims_nightly.sh
          bash flows/scripts/run_semantic_regressions_v6.sh
      - name: Upload release gate logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-gate-logs-${{ env.PYC_GATE_RUN_ID }}
          path: docs/gates/logs/${{ env.PYC_GATE_RUN_ID }}/
          retention-days: 30

  build-platform-candidates:
    needs: [full-validation, build-universal-wheels]
    if: github.repository == 'PTO-ISA/pyCircuit'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            runner_os: Linux
          - os: macos-15
            platform: macos-arm64
            runner_os: macOS
          - os: windows-2022
            platform: windows-x86_64
            runner_os: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Enforce runner OS and architecture match the platform profile
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expectedOs = "${{ matrix.runner_os }}"
          if ($env:RUNNER_OS -ne $expectedOs) {
            throw "platform ${{ matrix.platform }} requires a $expectedOs runner, observed $env:RUNNER_OS"
          }
          Write-Host "runner profile verified: $env:RUNNER_OS $env:RUNNER_ARCH"
      - name: Download retained universal wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-shard-universal
          path: universal
      - name: Install platform dependencies
        # Unix-only lane: the Windows dependency step below owns windows-2022.
        if: matrix.runner_os != 'Windows'
        run: |
          set -euxo pipefail
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y wget gnupg software-properties-common cmake ninja-build clang patchelf
            command -v patchelf
            wget --https-only https://apt.llvm.org/llvm.sh
            printf '%s  %s\n' "${LLVM_INSTALL_SCRIPT_SHA256}" llvm.sh | sha256sum --check --strict
            chmod +x llvm.sh && sudo ./llvm.sh "${LLVM_VERSION}"
            sudo apt-get install -y "llvm-${LLVM_VERSION}-dev" "mlir-${LLVM_VERSION}-tools" "libmlir-${LLVM_VERSION}-dev"
            echo "/usr/lib/llvm-${LLVM_VERSION}/bin" >> "$GITHUB_PATH"
          else
            brew install ninja cmake "llvm@${LLVM_VERSION}"
            echo "$(brew --prefix "llvm@${LLVM_VERSION}")/bin" >> "$GITHUB_PATH"
          fi
          python3 -m pip install setuptools wheel twine
      - name: Configure MSVC developer environment
        if: matrix.runner_os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
          toolset: "14.4"
      - name: Restore the Windows LLVM/MLIR build
        if: matrix.runner_os == 'Windows'
        id: llvm-cache
        # restore/save are split so a successful LLVM build is cached even when
        # a later step of the same job fails; a plain actions/cache only saves
        # at job end, which would rebuild LLVM on every failing iteration.
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}\llvm-mlir
          key: llvm-mlir-${{ env.LLVM_PACKAGE_VERSION }}-${{ env.LLVM_WINDOWS_BUILD_ID }}-${{ env.LLVM_SOURCE_SHA256 }}
      - name: Build LLVM/MLIR from the pinned source (Windows)
        if: matrix.runner_os == 'Windows' && steps.llvm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $prefix = "$env:RUNNER_TEMP\llvm-mlir"
          $source = "$env:RUNNER_TEMP\llvm-source"
          New-Item -ItemType Directory -Force -Path $source | Out-Null
          $archive = "$source\llvm-project-$env:LLVM_PACKAGE_VERSION.src.tar.xz"
          Write-Host "free space before fetch: $([math]::Round((Get-PSDrive C).Free / 1GB, 1)) GiB"
          if (-not (Test-Path $archive)) {
            $started = Get-Date
            # curl.exe is present on the runner images and fails loudly instead
            # of stalling the way Invoke-WebRequest can.
            curl.exe --fail --location --retry 3 --retry-delay 5 --max-time 3600 --output "$archive" "$env:LLVM_SOURCE_URL"
            if ($LASTEXITCODE -ne 0) { throw "LLVM source download failed with exit code $LASTEXITCODE" }
            Write-Host "downloaded in $([int]((Get-Date) - $started).TotalSeconds)s"
          }
          $actual = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:LLVM_SOURCE_SHA256) {
            throw "LLVM source SHA256 mismatch: $actual"
          }
          $srcRoot = "$source\llvm-project-$env:LLVM_PACKAGE_VERSION.src"
          if (-not (Test-Path "$srcRoot\llvm\CMakeLists.txt")) {
            $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
            if (-not $sevenZip -and (Test-Path "C:\Program Files\7-Zip\7z.exe")) {
              $sevenZip = "C:\Program Files\7-Zip\7z.exe"
            }
            if ($sevenZip) {
              # 7-Zip exits 2 after refusing the LLVM test-input symlinks that
              # point outside the tree ("Dangerous link path was ignored").
              # Those paths are clang/lldb test fixtures the build never reads,
              # so warn instead of failing and let the layout check below prove
              # the extracted tree is usable.
              & $sevenZip x -y "-o$source" "$archive" | Out-Null
              if ($LASTEXITCODE -ne 0) {
                Write-Host "7z reported exit code $LASTEXITCODE on the source archive; verifying the extracted tree instead"
              }
              $inner = "$source\llvm-project-$env:LLVM_PACKAGE_VERSION.src.tar"
              if (Test-Path $inner) {
                & $sevenZip x -y "-o$source" "$inner" | Out-Null
                if ($LASTEXITCODE -ne 0) {
                  Write-Host "7z reported exit code $LASTEXITCODE on the source tar; verifying the extracted tree instead"
                }
                Remove-Item $inner -Force
              }
            } else {
              # The bundled bsdtar does not decode .tar.xz reliably here.
              python3 -c "import sys, tarfile; tarfile.open(sys.argv[1]).extractall(sys.argv[2])" "$archive" "$source"
              if ($LASTEXITCODE -ne 0) { throw "python tarfile extraction failed with exit code $LASTEXITCODE" }
            }
          }
          if (-not (Test-Path "$srcRoot\llvm\CMakeLists.txt")) {
            Write-Host "extracted top level:"
            Get-ChildItem $source | Select-Object -First 5 | ForEach-Object { Write-Host "  $($_.Name)" }
            throw "LLVM source layout is unexpected: $srcRoot"
          }
          $started = Get-Date
          cmake -G Ninja -S "$srcRoot\llvm" -B "$source\build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix" $env:LLVM_WINDOWS_CMAKE_OPTIONS.Split(" ")
          if ($LASTEXITCODE -ne 0) { throw "LLVM/MLIR configure failed with exit code $LASTEXITCODE" }
          cmake --build "$source\build" --target install --parallel
          if ($LASTEXITCODE -ne 0) { throw "LLVM/MLIR build failed with exit code $LASTEXITCODE" }
          Write-Host "LLVM/MLIR installed in $([int]((Get-Date) - $started).TotalSeconds)s"
      - name: Cache the Windows LLVM/MLIR build
        if: matrix.runner_os == 'Windows' && steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}\llvm-mlir
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}
      - name: Expose the Windows LLVM/MLIR install
        if: matrix.runner_os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $prefix = "$env:RUNNER_TEMP\llvm-mlir"
          foreach ($needed in @("$prefix\lib\cmake\llvm", "$prefix\lib\cmake\mlir", "$prefix\bin\llvm-config.exe")) {
            if (-not (Test-Path $needed)) {
              Write-Host "install top level:"
              Get-ChildItem $prefix | Select-Object -First 10 | ForEach-Object { Write-Host "  $($_.Name)" }
              throw "Windows LLVM/MLIR provisioning is incomplete: missing $needed"
            }
          }
          "LLVM_ROOT=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LLVM_DIR=$prefix\lib\cmake\llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MLIR_DIR=$prefix\lib\cmake\mlir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$prefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          python3 -m pip install --upgrade cmake ninja setuptools wheel twine
      - name: Restore the pinned clang-cl driver (Windows)
        if: matrix.runner_os == 'Windows'
        id: clang-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}\clang-cl
          key: clang-cl-${{ env.CLANG_PACKAGE_VERSION }}-${{ env.CLANG_SOURCE_SHA256 }}
      - name: Provision the pinned clang-cl driver (Windows)
        if: matrix.runner_os == 'Windows' && steps.clang-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $root = "$env:RUNNER_TEMP\clang-cl"
          $archive = "$env:RUNNER_TEMP\clang+llvm-$env:CLANG_PACKAGE_VERSION-x86_64-pc-windows-msvc.tar.xz"
          if (-not (Test-Path $archive)) {
            $started = Get-Date
            curl.exe --fail --location --retry 3 --retry-delay 5 --max-time 3600 --output "$archive" "$env:CLANG_SOURCE_URL"
            if ($LASTEXITCODE -ne 0) { throw "clang-cl download failed with exit code $LASTEXITCODE" }
            Write-Host "downloaded in $([int]((Get-Date) - $started).TotalSeconds)s"
          }
          $actual = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:CLANG_SOURCE_SHA256) {
            throw "clang-cl archive SHA256 mismatch: $actual"
          }
          python3 -c "import sys, tarfile; a, d, p = sys.argv[1], sys.argv[2], sys.argv[3]; t = tarfile.open(a); m = [x for x in t.getmembers() if x.name in (p + '/bin/clang-cl.exe', p + '/bin/clang.exe') or x.name.startswith(p + '/lib/clang/')]; t.extractall(d, members=m); print('extracted', len(m), 'members')" "$archive" "$root" "clang+llvm-$env:CLANG_PACKAGE_VERSION-x86_64-pc-windows-msvc"
          if ($LASTEXITCODE -ne 0) { throw "clang-cl extraction failed with exit code $LASTEXITCODE" }
      - name: Cache the pinned clang-cl driver (Windows)
        if: matrix.runner_os == 'Windows' && steps.clang-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}\clang-cl
          key: ${{ steps.clang-cache.outputs.cache-primary-key }}
      - name: Expose the pinned clang-cl driver (Windows)
        if: matrix.runner_os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "$env:RUNNER_TEMP\clang-cl\clang+llvm-$env:CLANG_PACKAGE_VERSION-x86_64-pc-windows-msvc"
          foreach ($needed in @("$root\bin\clang-cl.exe", "$root\lib\clang\$env:CLANG_RESOURCE_VERSION\include\stddef.h", "$root\lib\clang\$env:CLANG_RESOURCE_VERSION\lib\windows\clang_rt.builtins-x86_64.lib")) {
            if (-not (Test-Path $needed)) {
              throw "clang-cl provisioning is incomplete: missing $needed"
            }
          }
          "CLANG_CL_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build retained platform bytes
        # Unix-only lane: the Windows build step below owns windows-2022.
        if: matrix.runner_os != 'Windows'
        run: |
          set -euxo pipefail
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            llvm_config="/usr/lib/llvm-${LLVM_VERSION}/bin/llvm-config"
            export CC="/usr/bin/clang-${LLVM_VERSION}"
            export CXX="/usr/bin/clang++-${LLVM_VERSION}"
            [[ "$(${CXX} -dumpmachine)" == x86_64*-linux-* ]]
          else
            llvm_root="$(brew --prefix "llvm@${LLVM_VERSION}")"
            llvm_config="${llvm_root}/bin/llvm-config"
            export CC="/usr/bin/clang"
            export CXX="/usr/bin/clang++"
            export MACOSX_DEPLOYMENT_TARGET=15.0
            [[ "$(${CXX} -dumpmachine)" == arm64-apple-* ]]
          fi
          export CFLAGS="-ffile-prefix-map=$GITHUB_WORKSPACE=. -fdebug-prefix-map=$GITHUB_WORKSPACE=."
          export CXXFLAGS="$CFLAGS"
          export PYC_PYTHON_EXECUTABLE="$(command -v python3)"
          bash flows/scripts/pyc build --llvm-config "${llvm_config}" --build-dir "$PWD/.pycircuit_out/toolchain/build" --install-prefix "$PWD/.pycircuit_out/toolchain/install"
          mkdir candidate
          python3 packaging/wheel/create_wheel.py --install-dir "$PWD/.pycircuit_out/toolchain/install" --out-dir candidate --wheel-version "${{ inputs.version }}"
          wheel="$(find candidate -maxdepth 1 -name 'pycircuit_hisi-*.whl' -print -quit)"
          python3 packaging/sdk/create_platform_manifest.py \
            --install-dir "$PWD/.pycircuit_out/toolchain/install" \
            --wheel "${wheel}" \
            --wheel "$(find universal -name 'pycircuit_semantic_core-*.whl' -print -quit)" \
            --wheel "$(find universal -name 'agentic_circuit-*.whl' -print -quit)" \
            --platform "${{ matrix.platform }}" \
            --source-revision "${{ inputs.commit_sha }}" \
            --cxx-compiler "${CXX}" \
            --out-dir candidate
          python3 -m twine check candidate/*.whl
      - name: Build retained platform bytes (Windows)
        if: matrix.runner_os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # -ffile-prefix-map keeps producer absolute paths out of the retained
          # bytes. clang-cl implements it for __FILE__ and debug info alike;
          # cl.exe's /pathmap: is silently ignored without
          # /experimental:deterministic.
          $llvmConfig = "$env:LLVM_ROOT\bin\llvm-config.exe"
          $env:CC = "clang-cl.exe"
          $env:CXX = "clang-cl.exe"
          # clang-cl never prints the MSVC banner cl.exe does, but it does
          # report its own version and the target triple it will emit. Assert
          # both, plus the Visual Studio developer environment that supplies
          # INCLUDE/LIB and link.exe.
          if (-not (Get-Command clang-cl.exe -ErrorAction SilentlyContinue)) {
            throw "clang-cl.exe is not on PATH; the pinned driver was not provisioned"
          }
          # PowerShell's -notmatch returns the elements that do NOT match when
          # it is handed an array, so join the banner into one string first.
          $clangInfo = (& clang-cl.exe --version) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "clang-cl.exe --version failed with exit code $LASTEXITCODE" }
          if ($clangInfo -notmatch [regex]::Escape("clang version $env:CLANG_PACKAGE_VERSION")) {
            throw "the Windows lane requires the pinned clang $env:CLANG_PACKAGE_VERSION; observed: $($clangInfo -join ' | ')"
          }
          if ($clangInfo -notmatch "Target:\s*x86_64-pc-windows-msvc") {
            throw "clang-cl must emit x86_64-pc-windows-msvc; observed: $($clangInfo -join ' | ')"
          }
          if ($env:VSCMD_ARG_HOST_ARCH -ne "x64" -or $env:VSCMD_ARG_TGT_ARCH -ne "x64") {
            throw "windows-x86_64 requires an x64 host and target; observed host=$env:VSCMD_ARG_HOST_ARCH target=$env:VSCMD_ARG_TGT_ARCH"
          }
          $hostTarget = "$(& $llvmConfig --host-target)"
          if ($hostTarget -notmatch "x86_64-pc-windows-msvc") {
            throw "the provisioned LLVM/MLIR targets $hostTarget, not x86_64-pc-windows-msvc"
          }
          # clang-cl has no -ffile-prefix-map spelling of its own: it treats
          # the flag as an unknown argument and ignores it, so the mapping
          # goes through the /clang: escape to the clang driver. Both separator
          # spellings are mapped because CMake emits Windows source paths with
          # backslashes while clang may normalise some to forward slashes, and
          # the verification lane rejects any retained producer path under the
          # workspace.
          $workspace = $env:GITHUB_WORKSPACE
          $prefixMaps = "/clang:-ffile-prefix-map=$workspace=. /clang:-ffile-prefix-map=$($workspace.Replace('\', '/'))=."
          $env:CFLAGS = $prefixMaps
          $env:CXXFLAGS = $prefixMaps
          $env:PYC_PYTHON_EXECUTABLE = (Get-Command python3).Source
          pwsh -NoProfile -File flows/scripts/pyc.ps1 build --llvm-config "$llvmConfig" --build-dir "$PWD/.pycircuit_out/toolchain/build" --install-prefix "$PWD/.pycircuit_out/toolchain/install"
          if ($LASTEXITCODE -ne 0) { throw "the platform SDK build failed with exit code $LASTEXITCODE" }
          New-Item -ItemType Directory -Force -Path candidate | Out-Null
          python3 packaging/wheel/create_wheel.py --install-dir "$PWD/.pycircuit_out/toolchain/install" --out-dir candidate --wheel-version "${{ inputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw "wheel creation failed with exit code $LASTEXITCODE" }
          $wheel = (Get-ChildItem candidate -Filter "pycircuit_hisi-*.whl" | Select-Object -First 1).FullName
          $semanticWheel = (Get-ChildItem universal -Filter "pycircuit_semantic_core-*.whl" | Select-Object -First 1).FullName
          $agenticWheel = (Get-ChildItem universal -Filter "agentic_circuit-*.whl" | Select-Object -First 1).FullName
          if (-not $wheel -or -not $semanticWheel -or -not $agenticWheel) {
            throw "the platform wheel or a universal wheel is missing from the retained shards"
          }
          python3 packaging/sdk/create_platform_manifest.py --install-dir "$PWD/.pycircuit_out/toolchain/install" --wheel "$wheel" --wheel "$semanticWheel" --wheel "$agenticWheel" --platform "${{ matrix.platform }}" --source-revision "${{ inputs.commit_sha }}" --cxx-compiler "$env:CXX" --out-dir candidate
          # $ErrorActionPreference does not make a failing native command fatal,
          # so this exit code must be checked explicitly. Without it a failed
          # manifest or archive step is masked and the lane uploads a partial
          # candidate, which only surfaces later as a missing file in verify.
          if ($LASTEXITCODE -ne 0) { throw "platform manifest and archive creation failed with exit code $LASTEXITCODE" }
          $wheels = @(Get-ChildItem candidate -Filter "*.whl")
          if ($wheels.Count -eq 0) {
            throw "no candidate wheels were produced"
          }
          python3 -m twine check @($wheels | ForEach-Object { $_.FullName })
          if ($LASTEXITCODE -ne 0) { throw "twine check failed with exit code $LASTEXITCODE" }
      - name: Upload retained platform bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-shard-platform-${{ matrix.platform }}
          path: candidate/
          if-no-files-found: error
          retention-days: 7

  build-universal-wheels:
    needs: [full-validation]
    if: github.repository == 'PTO-ISA/pyCircuit'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Build retained universal wheels and metadata
        run: |
          python3 -m pip install build twine
          mkdir candidate licenses
          python3 -m build --wheel --outdir candidate python/semantic-core
          python3 -m build --wheel --outdir candidate python/agentic-circuit
          python3 -m twine check candidate/*.whl
          python3 -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install --no-index --find-links candidate agentic-circuit
          wheel-smoke/bin/agentic-circuit explain ACPY-RULE-014 --json > wheel-smoke/explain.json
          wheel-smoke/bin/python - <<'PY'
          import json
          from pathlib import Path

          explanation = json.loads(Path("wheel-smoke/explain.json").read_text())
          if explanation.get("code") != "ACPY-RULE-014":
              raise SystemExit("installed Agentic Circuit diagnostic catalog is incomplete")
          PY
          cp LICENSE licenses/LICENSE
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf candidate/LICENSES.tar.gz -C licenses LICENSE
          git show -s --format='pyCircuit ${{ inputs.version }}%n%nSource revision: %H%n%n%s%n' "${{ inputs.commit_sha }}" > candidate/RELEASE_NOTES.md
      - name: Upload retained universal bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-shard-universal
          path: candidate/
          if-no-files-found: error
          retention-days: 7

  aggregate-candidate:
    needs: [build-platform-candidates, build-universal-wheels]
    if: github.repository == 'PTO-ISA/pyCircuit'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Download candidate shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-shard-*
          path: shards
      - name: Deterministically aggregate exact candidate set
        run: |
          python3 -m pip install jsonschema
          python3 packaging/sdk/release_candidate.py aggregate --candidate-dir shards --out-dir candidate --source-revision "${{ inputs.commit_sha }}"
          python3 tools/agentic-circuit/check-sdk-contract.py \
            --document candidate/pycircuit-sdk-${{ inputs.version }}-release-index.json \
            --document candidate/pycircuit-sdk-${{ inputs.version }}-linux-x86_64.manifest.json \
            --document candidate/pycircuit-sdk-${{ inputs.version }}-macos-arm64.manifest.json \
            --document candidate/pycircuit-sdk-${{ inputs.version }}-windows-x86_64.manifest.json \
            --document candidate/pycircuit-sdk-${{ inputs.version }}-linux-x86_64.lock.json \
            --document candidate/pycircuit-sdk-${{ inputs.version }}-macos-arm64.lock.json \
            --document candidate/pycircuit-sdk-${{ inputs.version }}-windows-x86_64.lock.json
      - name: Upload immutable candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate-${{ inputs.commit_sha }}
          path: candidate/
          if-no-files-found: error
          retention-days: 7

  verify-platform-candidates:
    needs: [aggregate-candidate]
    if: github.repository == 'PTO-ISA/pyCircuit'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            runner_os: Linux
          - os: macos-15
            platform: macos-arm64
            runner_os: macOS
          - os: windows-2022
            platform: windows-x86_64
            runner_os: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Enforce runner OS and architecture match the platform profile
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expectedOs = "${{ matrix.runner_os }}"
          if ($env:RUNNER_OS -ne $expectedOs) {
            throw "platform ${{ matrix.platform }} requires a $expectedOs runner, observed $env:RUNNER_OS"
          }
          Write-Host "runner profile verified: $env:RUNNER_OS $env:RUNNER_ARCH"
      - name: Configure MSVC developer environment
        # verify_platform_candidate.py needs dumpbin to check the Windows PE
        # closure; vcvars64 must be loaded before that step.
        if: matrix.runner_os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
          toolset: "14.4"
      - name: Download immutable candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate-${{ inputs.commit_sha }}
          path: candidate
      - name: Verify candidate relocation, manifest, wheels, and installed smoke
        # Unix-only lane: the Windows verification step below owns windows-2022.
        if: matrix.runner_os != 'Windows'
        run: |
          python3 -m pip install jsonschema
          python3 tools/agentic-circuit/check-sdk-contract.py --document "candidate/pycircuit-sdk-${{ inputs.version }}-${{ matrix.platform }}.manifest.json"
          python3 packaging/sdk/verify_platform_candidate.py \
            --archive "candidate/pycircuit-sdk-${{ inputs.version }}-${{ matrix.platform }}.tar.gz" \
            --manifest "candidate/pycircuit-sdk-${{ inputs.version }}-${{ matrix.platform }}.manifest.json" \
            --forbidden-path "$GITHUB_WORKSPACE" \
            --attestation "candidate-verification-${{ matrix.platform }}.json"
      - name: Verify candidate relocation, manifest, wheels, and installed smoke (Windows)
        if: matrix.runner_os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python3 -m pip install jsonschema
          python3 tools/agentic-circuit/check-sdk-contract.py --document "candidate/pycircuit-sdk-${{ inputs.version }}-${{ matrix.platform }}.manifest.json"
          python3 packaging/sdk/verify_platform_candidate.py --archive "candidate/pycircuit-sdk-${{ inputs.version }}-${{ matrix.platform }}.tar.gz" --manifest "candidate/pycircuit-sdk-${{ inputs.version }}-${{ matrix.platform }}.manifest.json" --forbidden-path "$env:GITHUB_WORKSPACE" --attestation "candidate-verification-${{ matrix.platform }}.json"
      - name: Retain platform candidate verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-verification-${{ matrix.platform }}-${{ inputs.commit_sha }}
          path: candidate-verification-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 90

  accept-candidate:
    needs: [aggregate-candidate, verify-platform-candidates]
    if: github.repository == 'PTO-ISA/pyCircuit'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Download immutable candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate-${{ inputs.commit_sha }}
          path: candidate
      - name: Candidate acceptance barrier
        run: mkdir evidence && python3 packaging/sdk/release_candidate.py accept --candidate-dir candidate --source-revision "${{ inputs.commit_sha }}" --attestation evidence/ACCEPTANCE.json
      - name: Retain accepted bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: accepted-release-${{ inputs.commit_sha }}
          path: candidate/
          if-no-files-found: error
          retention-days: 30
      - name: Retain acceptance evidence separately
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-acceptance-${{ inputs.commit_sha }}
          path: evidence/ACCEPTANCE.json
          if-no-files-found: error
          retention-days: 90

  create-tag:
    needs: [accept-candidate]
    if: github.repository == 'PTO-ISA/pyCircuit'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout exact accepted SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Create annotated tag after acceptance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" "${{ inputs.commit_sha }}" -m "pyCircuit ${{ inputs.version }}"
          test "$(git cat-file -t "v${{ inputs.version }}")" = tag
          test "$(git rev-parse "v${{ inputs.version }}^{}")" = "${{ inputs.commit_sha }}"
          git push origin "refs/tags/v${{ inputs.version }}"
          test "$(git ls-remote origin "refs/tags/v${{ inputs.version }}^{}" | cut -f1)" = "${{ inputs.commit_sha }}"

  publish-release:
    needs: [create-tag]
    if: github.repository == 'PTO-ISA/pyCircuit'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    environment:
      name: release
    steps:
      - name: Download accepted bytes without rebuilding
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: accepted-release-${{ inputs.commit_sha }}
          path: candidate
      - name: Publish retained bytes to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ inputs.version }}" candidate/* --repo "${{ github.repository }}" --title "pyCircuit ${{ inputs.version }}" --notes-file candidate/RELEASE_NOTES.md --verify-tag
      - name: Select retained wheel bytes for PyPI
        if: vars.PYC_PUBLISH_PYPI == '1'
        run: mkdir wheels && cp candidate/*.whl wheels/
      - name: Publish the same four retained wheels to PyPI
        if: vars.PYC_PUBLISH_PYPI == '1'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: wheels

  publish-ghcr:
    needs: [create-tag]
    if: github.repository == 'PTO-ISA/pyCircuit'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download accepted bytes without rebuilding
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: accepted-release-${{ inputs.commit_sha }}
          path: candidate
      - name: Set up ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
      - name: Publish retained SDK archives to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "${GH_TOKEN}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          for platform in linux-x86_64 macos-arm64 windows-x86_64; do
            archive="candidate/pycircuit-sdk-${{ inputs.version }}-${platform}.tar.gz"
            oras push "ghcr.io/pto-isa/pyc-tools-${platform}:v${{ inputs.version }}" "${archive}:application/gzip"
          done

  verify-stable-platforms:
    needs: [verify-published-bytes]
    if: github.repository == 'PTO-ISA/pyCircuit'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            runner_os: Linux
          - os: macos-15
            platform: macos-arm64
            runner_os: macOS
          - os: windows-2022
            platform: windows-x86_64
            runner_os: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Enforce runner OS and architecture match the platform profile
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expectedOs = "${{ matrix.runner_os }}"
          if ($env:RUNNER_OS -ne $expectedOs) {
            throw "platform ${{ matrix.platform }} requires a $expectedOs runner, observed $env:RUNNER_OS"
          }
          Write-Host "runner profile verified: $env:RUNNER_OS $env:RUNNER_ARCH"
      - name: Configure MSVC developer environment
        # The Windows lane needs dumpbin and nm from the MSVC dev environment.
        if: matrix.runner_os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
          toolset: "14.4"
      - name: Redownload stable assets and verify exact bytes before execution
        # flows/scripts and this step are POSIX shell; Git Bash ships with the
        # windows-2022 image, so the same script runs on all three lanes.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install jsonschema
          mkdir stable
          gh release download "v${{ inputs.version }}" --repo "${{ github.repository }}" --dir stable
          mkdir evidence
          python3 packaging/sdk/release_candidate.py accept \
            --candidate-dir stable \
            --source-revision "${{ inputs.commit_sha }}" \
            --attestation "evidence/stable-bytes-${{ matrix.platform }}.json"
          archive="pycircuit-sdk-${{ inputs.version }}-${{ matrix.platform }}.tar.gz"
          manifest="pycircuit-sdk-${{ inputs.version }}-${{ matrix.platform }}.manifest.json"
          python3 tools/agentic-circuit/check-sdk-contract.py --document "stable/${manifest}"
          python3 packaging/sdk/verify_platform_candidate.py \
            --archive "stable/${archive}" \
            --manifest "stable/${manifest}" \
            --forbidden-path "$GITHUB_WORKSPACE" \
            --candidate-tag "v${{ inputs.version }}" \
            --release-url "https://github.com/${{ github.repository }}/releases/tag/v${{ inputs.version }}" \
            --attestation "evidence/stable-platform-${{ matrix.platform }}.json"
      - name: Retain stable platform verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stable-verification-${{ matrix.platform }}-${{ inputs.commit_sha }}
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 90

  verify-published-bytes:
    needs: [publish-release]
    if: github.repository == 'PTO-ISA/pyCircuit'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Download accepted release index
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: accepted-release-${{ inputs.commit_sha }}
          path: candidate
      - name: Verify stable GitHub Release URLs serve accepted bytes
        run: python3 packaging/sdk/release_candidate.py verify-published --release-index "candidate/pycircuit-sdk-${{ inputs.version }}-release-index.json" --candidate-dir candidate --attestation publication-attestation.json
      - name: Retain publication attestation as Actions evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publication-attestation-${{ inputs.commit_sha }}
          path: publication-attestation.json
          if-no-files-found: error
          retention-days: 90
      - name: Add publication result to workflow summary
        run: cat publication-attestation.json >> "$GITHUB_STEP_SUMMARY"

  release-attestation:
    needs: [verify-published-bytes, verify-stable-platforms, publish-ghcr]
    if: github.repository == 'PTO-ISA/pyCircuit'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      issues: write
    steps:
      - name: Download publication verification
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: publication-attestation-${{ inputs.commit_sha }}
          path: evidence/publication
      - name: Download stable platform verification
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: stable-verification-*-${{ inputs.commit_sha }}
          path: evidence/platforms
          merge-multiple: true
      - name: Create immutable final release attestation
        env:
          ASSET_URL_PREFIX: https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version }}/
          CANDIDATE_TAG: v${{ inputs.version }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/v${{ inputs.version }}
          SOURCE_REVISION: ${{ inputs.commit_sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          publication = json.loads(
              Path("evidence/publication/publication-attestation.json").read_text()
          )
          platforms = [
              json.loads(path.read_text())
              for path in sorted(Path("evidence/platforms").glob("stable-platform-*.json"))
          ]
          source_revision = os.environ["SOURCE_REVISION"]
          candidate_tag = os.environ["CANDIDATE_TAG"]
          asset_url_prefix = os.environ["ASSET_URL_PREFIX"]
          release_url = os.environ["RELEASE_URL"]
          if (
              publication.get("schema")
              != "pycircuit-release-publication-attestation"
              or publication.get("verified") is not True
              or publication.get("source_revision") != source_revision
              or publication.get("candidate_tag") != candidate_tag
              or not publication.get("assets")
              or any(
                  not item.get("url", "").startswith(asset_url_prefix)
                  for item in publication["assets"]
              )
          ):
              raise SystemExit("publication attestation is not bound to this release")
          if {item["platform"] for item in platforms} != {
              "linux-x86_64",
              "macos-arm64",
              "windows-x86_64",
          }:
              raise SystemExit("every stable platform attestation is required")
          for item in platforms:
              if (
                  item.get("schema") != "pycircuit-platform-verification"
                  or item.get("verified") is not True
                  or item.get("source_revision") != source_revision
                  or item.get("candidate_tag") != candidate_tag
                  or item.get("release_url") != release_url
                  or item.get("relocated_model_consumer") is not True
                  or item.get("incremental_determinism") is not True
                  or item.get("topology_change") is not True
                  or item.get("parallel_same_root") is not True
                  or item.get("mismatch_rejection") is not True
                  or item.get("unsupported_boundary_rejection") is not True
              ):
                  raise SystemExit(
                      "platform attestation is not bound to this release"
                  )
          result = {
              "schema": "pycircuit-release-final-attestation",
              "version": "1",
              "source_revision": source_revision,
              "candidate_tag": candidate_tag,
              "release_url": release_url,
              "publication": publication,
              "platforms": platforms,
              "ghcr_retained_archives": True,
              "verified": True,
          }
          Path("release-final-attestation.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n"
          )
          PY
      - name: Retain final release attestation outside release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-final-attestation-${{ inputs.commit_sha }}
          path: release-final-attestation.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish final verification summary
        run: cat release-final-attestation.json >> "$GITHUB_STEP_SUMMARY"
      - name: Link immutable verification from release and issue 61
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh release view "v${{ inputs.version }}" --repo "${{ github.repository }}" --json body --jq .body > release-notes.md
          printf '\n\nVerification attestation: %s\n' "${ATTESTATION_URL}" >> release-notes.md
          gh release edit "v${{ inputs.version }}" --repo "${{ github.repository }}" --notes-file release-notes.md
          gh issue comment 61 --repo "${{ github.repository }}" --body "Release v${{ inputs.version }} verification attestation: ${ATTESTATION_URL}"
