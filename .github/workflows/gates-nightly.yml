name: Nightly API and Example Tests

on:
  workflow_dispatch:
  schedule:
    # 08:00 UTC daily
    - cron: "0 8 * * *"

permissions:
  contents: read

env:
  LLVM_VERSION: "22"
  VERILATOR_VERSION: "5.048"
  CMAKE_BUILD_TYPE: Release
  PYC_GATE_RUN_ID: nightly-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  nightly-linux:
    name: "API and Examples (Linux)"
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"

      - name: Install LLVM 22 + build/sim deps
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y wget gnupg software-properties-common cmake ninja-build clang iverilog libgtest-dev
          wget --https-only https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${LLVM_VERSION}
          sudo apt-get install -y llvm-${LLVM_VERSION}-dev mlir-${LLVM_VERSION}-tools libmlir-${LLVM_VERSION}-dev
          echo "/usr/lib/llvm-${LLVM_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Install test tools
        run: python -m pip install pytest

      - name: Setup native test tools
        uses: ./.github/actions/setup-native-test-tools

      - name: Setup Verilator
        uses: ./.github/actions/setup-verilator
        with:
          version: ${{ env.VERILATOR_VERSION }}

      - name: Build staged toolchain
        run: |
          LLVM_CONFIG=/usr/lib/llvm-${LLVM_VERSION}/bin/llvm-config \
          bash flows/scripts/pyc build \
            --build-dir "$PWD/.pycircuit_out/toolchain/build" \
            --install-prefix "$PWD/.pycircuit_out/toolchain/install"

      - name: Run API tests (nightly)
        id: api_nightly
        shell: bash
        run: |
          set -euxo pipefail
          export PYC_TOOLCHAIN_ROOT="$PWD/.pycircuit_out/toolchain/install"
          export PATH="$PYC_TOOLCHAIN_ROOT/bin:$PATH"
          export PYC_GATE_RUN_ID="${PYC_GATE_RUN_ID}"
          unset PYCC || true
          bash flows/scripts/run_api_tests.sh --tier nightly

      - name: Run examples (nightly)
        id: examples_nightly
        if: ${{ !cancelled() && steps.api_nightly.outcome != 'skipped' }}
        run: |
          export PYC_TOOLCHAIN_ROOT="$PWD/.pycircuit_out/toolchain/install"
          bash flows/scripts/run_examples.sh --tier nightly

      - name: Write gate summary
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          map_outcome() {
            case "$1" in
              success) echo pass ;;
              failure) echo fail ;;
              skipped|cancelled) echo skip ;;
              *) echo unknown ;;
            esac
          }
          api_status="$(map_outcome "${{ steps.api_nightly.outcome }}")"
          examples_status="$(map_outcome "${{ steps.examples_nightly.outcome }}")"
          python3 flows/tools/summarize_gate_run.py \
            --run-id "${PYC_GATE_RUN_ID}" \
            --row "api-nightly:nightly:${api_status}" \
            --row "examples-nightly:nightly:${examples_status}" \
            --append-to "${GITHUB_STEP_SUMMARY}"

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gate-logs-g3-${{ env.PYC_GATE_RUN_ID }}
          path: docs/gates/logs/${{ env.PYC_GATE_RUN_ID }}/
          if-no-files-found: warn
          retention-days: 14
