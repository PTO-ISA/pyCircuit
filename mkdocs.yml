# pyCircuit Documentation Configuration

site_name: pyCircuit
site_description: "Python-first hardware construction and architecture modeling with MLIR, C++ simulation, and Verilog generation"
site_author: PTO-ISA Contributors

repo_url: https://github.com/PTO-ISA/pyCircuit
repo_name: PTO-ISA/pyCircuit

copyright: "Copyright &copy; 2024&ndash;2026 PTO-ISA Contributors"

# Configuration
docs_dir: docs
site_dir: _build/html
exclude_docs: |
  gates/logs/

# Theme
theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

# Markdown extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

