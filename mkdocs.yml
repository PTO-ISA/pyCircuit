# pyCircuit Documentation Configuration

site_name: pyCircuit
site_description: "A Python-based hardware description framework that compiles Python functions to synthesizable RTL through MLIR"
site_author: PTO-ISA Contributors
site_url: https://github.com/PTO-ISA/pyCircuit

repo_url: https://github.com/PTO-ISA/pyCircuit
repo_name: PTO-ISA/pyCircuit

copyright: "Copyright &copy; 2024 PTO-ISA Contributors"

# Configuration
docs_dir: docs
site_dir: _build/html

# Theme
theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

# Markdown extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

