# pyCircuit Documentation Configuration

site_name: pyCircuit
site_description: "A Python-based hardware description framework that compiles Python functions to synthesizable RTL through MLIR"
site_author: PTO-ISA Contributors
site_url: https://github.com/PTO-ISA/pyCircuit

repo_url: https://github.com/PTO-ISA/pyCircuit
repo_name: PTO-ISA/pyCircuit

copyright: "Copyright &copy; 2024 PTO-ISA Contributors"

# Configuration
docs_dir: docs
site_dir: _build/html

# Theme
theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

# Markdown extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Navigation
nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Installation: getting-started/installation.md
      - Quickstart: QUICKSTART.md
  - pyCircuit 6:
      - Language Specification: v6_PyCircuit_Specification.md
      - Tutorial: v6_PyCircuit_Tutorial.md
      - Software Architecture: v6_PyCircuit_Software_Architecture.md
  - Core Docs:
      - QUICKSTART.md
      - FRONTEND_API.md
      - TESTBENCH.md
      - PRIMITIVES.md
      - SPEC_STRUCTURES.md
      - SPEC_COLLECTIONS.md
      - CONST_METAPROGRAMMING.md
      - IR_SPEC.md
      - DIAGNOSTICS.md
      - PIPELINE.md
  - API Reference:
      - api/index.md
  - Development:
      - Overview: development/index.md
      - Contributing Workflow: development/contributing-workflow.md
      - Testing and Gates: development/testing-and-gates.md
      - Review and Merge: development/review-and-merge.md
      - Repository Management: development/repository-management.md
  - Decisions:
      - pyCircuit 6 Decisions: rfcs/pyc6-decisions.md
      - Evolution Plan: pyc6-plan.md
      - Tier Annotation RFC: rfcs/tier_annotation.md
  - Gates:
      - Evidence Contract: gates/README.md
      - Decision Status: gates/decision_status_v6.md

# Plugins
plugins:
  - search:
      lang: en

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PTO-ISA/pyCircuit
    - icon: fontawesome/brands/python
      link: https://python.org
