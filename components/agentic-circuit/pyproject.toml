[project]
name = "agentic-circuit"
version = "0.1.0"
description = "IR-first architecture construction and graph-flow simulation"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [{ name = "PTO-ISA Contributors" }]
dependencies = []

[project.optional-dependencies]
test = ["jsonschema>=4.18", "lit>=18,<19"]

[project.scripts]
agentic-circuit = "agentic_circuit._cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/PTO-ISA/pyCircuit"
Issues = "https://github.com/PTO-ISA/pyCircuit/issues"

[tool.agentic-circuit]
contract-epoch = "0.4"
llvm-release = "22.1.8"
