repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        args: [--unsafe]
      - id: end-of-file-fixer
        exclude: ^(docs/gates/logs/|third_party/references/|examples/pycircuit/dodgeball_game/reference/)
      - id: trailing-whitespace
        exclude: ^(docs/gates/logs/|third_party/references/|examples/pycircuit/dodgeball_game/reference/)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.8
    hooks:
      - id: ruff
        exclude: ^(python/agentic-circuit/|compiler/acir/|simulator/gfsim/|schemas/agentic-circuit/|examples/agentic-circuit/|tests/(python|mlir|cpp|integration|goldens)/agentic-circuit/|tools/agentic-circuit/|toolchains/agentic-circuit/|third_party/references/|designs/blocks/BypassUnit/|designs/blocks/RegisterFile/)

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        exclude: ^(python/agentic-circuit/|compiler/acir/|simulator/gfsim/|schemas/agentic-circuit/|examples/agentic-circuit/|tests/(python|mlir|cpp|integration|goldens)/agentic-circuit/|tools/agentic-circuit/|toolchains/agentic-circuit/|third_party/references/)

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.18.1
    hooks:
      - id: markdownlint-cli2
        exclude: ^(docs/gates/logs/|third_party/references/|docs/acir/spec/|docs/development/acir/|docs/simulation\.md$|examples/agentic-circuit/|python/agentic-circuit/|tests/(python|mlir|cpp|integration|goldens)/agentic-circuit/|docs/cycle_balance_improvement.*\.md$)

  - repo: local
    hooks:
      - id: pyc-api-hygiene
        name: pyCircuit API hygiene gate
        entry: python3 flows/tools/check_api_hygiene.py
        language: system
        files: ^(python/pycircuit/src/pycircuit/|examples/pycircuit/|docs/|README\.md$|CONTRIBUTING\.md$)
        exclude: ^(docs/gates/logs/|python/pycircuit/src/pycircuit/api_contract\.py$)
