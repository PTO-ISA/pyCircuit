repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        args: [--unsafe]
      - id: end-of-file-fixer
        exclude: ^(docs/gates/logs/|examples/dodgeball_game/reference/)
      - id: trailing-whitespace
        exclude: ^(docs/gates/logs/|examples/dodgeball_game/reference/)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.8
    hooks:
      - id: ruff
        exclude: ^(docs/gates/logs/|python/agentic-circuit/|compiler/|runtime/|schemas/|examples/agentic-circuit/|tests/(python|mlir|cpp|integration|goldens)/agentic-circuit/|tools/agentic-circuit/|toolchains/|designs/blocks/BypassUnit/|designs/blocks/RegisterFile/)

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        # pyproject.toml force-excludes source-span-sensitive compiler fixtures.
        exclude: ^(docs/gates/logs/|python/agentic-circuit/|compiler/|runtime/|schemas/|examples/agentic-circuit/|tests/(python|mlir|cpp|integration|goldens)/agentic-circuit/|tools/agentic-circuit/|toolchains/)

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.18.1
    hooks:
      - id: markdownlint-cli2
        # Keep exact approved proposal bytes; constructor provenance spelling
        # in C2-DECL-R is interpreted as Markdown emphasis by the style checker.
        exclude: ^(docs/gates/logs/|docs/rfcs/contracts/(c2-n1-namespaces|c2-decl-record-final)\.md$|docs/acir/spec/|docs/development/acir/|docs/simulation\.md$|examples/agentic-circuit/|python/agentic-circuit/|tests/(python|mlir|cpp|integration|goldens)/agentic-circuit/|docs/cycle_balance_improvement.*\.md$)

  - repo: local
    hooks:
      - id: pyc-api-hygiene
        name: pyCircuit API hygiene gate
        entry: python3 tools/check_api_hygiene.py
        language: system
        files: ^(python/pycircuit/|examples/|docs/|README\.md$|CONTRIBUTING\.md$)
        exclude: ^(docs/gates/logs/|python/pycircuit/api_contract\.py$)
