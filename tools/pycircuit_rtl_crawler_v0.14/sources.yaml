sources:
- project: pulp_common_cells
  repo: https://github.com/pulp-platform/common_cells.git
  enabled: true
  priority: A
  families:
  - Integer
  - Reduction
  - Dataflow
  - Memory
  - CDC
  path_hints:
  - src
  - include
  exclude_dirs:
  - .git
  - docs
  - test
  - tests
  - lint
  - formal
  - build
  extensions:
  - .v
  - .sv
  - .vh
  - .svh
