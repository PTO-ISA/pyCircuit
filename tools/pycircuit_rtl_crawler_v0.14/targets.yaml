# pyCircuit Runtime Gap Matrix machine-readable discovery targets.
# Match is intentionally heuristic in crawler v0.1.
# target_id can be a precision-specific Design Point; gap_id points back to the v0.1 Gap Matrix class.

targets:
  # ---- Integer / Fixed ----
  - target_id: P0-INT-MUL
    gap_id: INT-05
    family: Integer
    operation: integer_multiplier
    priority: P0
    keywords: ["int_mul", "integer_mul", "multiplier"]

  - target_id: P0-INT-MAC
    gap_id: INT-06
    family: Integer
    operation: integer_mac
    priority: P0
    keywords: ["int_mac", "multiply_accumulate", "multiply-accumulate"]

  - target_id: P0-SAT-ADD
