[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wse-calendar-reproducer"
version = "0.1.0"
description = "WSE Calendar pyCircuit design and independent semantic references"
requires-python = ">=3.10"
license = {file = "LICENSE"}

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["unit: pure Python semantic and host-check tests"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs/design"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/wse_model/calendar/route_bits.py" = ["E741"]
"reproduction/*.py" = ["T201"]
"src/wse_model/acir/**/*.py" = ["N803", "N806", "N815"]
"src/wse_model/cli.py" = ["T201"]
"tests/**/*.py" = ["T201", "N803", "N806"]
"tools/*.py" = ["T201"]
"examples/**/*.py" = ["T201", "N803", "N806"]

[tool.ruff.format]
quote-style = "double"
